{% extends "base.html" %}

{% block title %}Kayıt Ol - Kütüphane Takip Sistemi{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 shadow-sm border-0">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 rounded-circle bg-success-subtle text-success mb-3">
                    <i class="bi bi-person-plus fs-1"></i>
                </div>
                <h3 class="fw-bold">Yeni Kullanıcı Kaydı</h3>
                <p class="text-muted small">Kütüphanemizden kitap ödünç almak için kayıt oluşturun</p>
            </div>

            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-3">
                    <label for="ad_soyad" class="form-label fw-semibold">Ad Soyad</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                        <input type="text" class="form-control" id="ad_soyad" name="ad_soyad" placeholder="Örn: Mehmet Can" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="kullanici_adi" class="form-label fw-semibold">Kullanıcı Adı</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-at"></i></span>
                        <input type="text" class="form-control" id="kullanici_adi" name="kullanici_adi" placeholder="Örn: mehmetcan" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="sifre" class="form-label fw-semibold">Şifre</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="sifre" name="sifre" placeholder="En az 4 karakter" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="sifre_tekrar" class="form-label fw-semibold">Şifre Tekrar</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="sifre_tekrar" name="sifre_tekrar" placeholder="Şifrenizi tekrar giriniz" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold btn-rounded">
                    <i class="bi bi-person-check me-1"></i> Kaydı Tamamla
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted small mb-0">Zaten hesabınız var mı? <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Giriş Yap</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
